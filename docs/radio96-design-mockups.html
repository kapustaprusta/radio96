  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;radio96-review-draft&#x27;);
      const product = root.querySelector(&#x27;[data-r96d-product]&#x27;);
      const main = root.querySelector(&#x27;[data-r96d-main]&#x27;);
      const scenario = root.querySelector(&#x27;[data-r96d-scenario]&#x27;);
      const deviceButtons = root.querySelectorAll(&#x27;[data-r96d-device]&#x27;);
      const themeButton = root.querySelector(&#x27;[data-r96d-theme]&#x27;);
      const toast = root.querySelector(&#x27;[data-r96d-toast]&#x27;);
      const toastText = root.querySelector(&#x27;[data-r96d-toast-text]&#x27;);
      const settings = root.querySelector(&#x27;[data-r96d-settings]&#x27;);
      const deviceSelects = [...settings.querySelectorAll(&#x27;[data-r96d-device-select]&#x27;)];
      const micTestPanel = settings.querySelector(&#x27;[data-r96d-mic-test]&#x27;);
      const speakerTestPanel = settings.querySelector(&#x27;[data-r96d-speaker-test]&#x27;);
      const micTestButton = settings.querySelector(&#x27;[data-r96d-mic-test-button]&#x27;);
      const speakerTestButton = settings.querySelector(&#x27;[data-r96d-speaker-test-button]&#x27;);
      const micTestMessage = settings.querySelector(&#x27;[data-r96d-mic-test-message]&#x27;);
      const speakerTestMessage = settings.querySelector(&#x27;[data-r96d-speaker-test-message]&#x27;);
      const micTestStatus = settings.querySelector(&#x27;[data-r96d-mic-test-status]&#x27;);
      const speakerTestStatus = settings.querySelector(&#x27;[data-r96d-speaker-test-status]&#x27;);
      const micWave = settings.querySelector(&#x27;[data-r96d-wave=&quot;mic&quot;]&#x27;);
      const speakerWave = settings.querySelector(&#x27;[data-r96d-wave=&quot;speaker&quot;]&#x27;);
      const reduceMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
      let darkTheme = window.matchMedia(&#x27;(prefers-color-scheme: dark)&#x27;).matches;
      const selectedDevices = {
        mic: &#x27;Микрофон MacBook Pro&#x27;,
        speaker: &#x27;Динамики MacBook Pro&#x27;
      };
      let current = &#x27;home&#x27;;
      let micOn = true;
      let settingsReturnFocus = null;
      let connectionTimer;
      let toastTimer;
      let micTestStream = null;
      let micTestContext = null;
      let micTestFrame = null;
      let micTestRun = 0;
      let speakerTestContext = null;
      let speakerTestOscillator = null;
      let speakerTestGain = null;
      let speakerTestFrame = null;
      let speakerToneTimer = null;
      let speakerStopTimer = null;
      let speakerTestRun = 0;

      const applyTheme = () =&gt; {
        root.style.colorScheme = darkTheme ? &#x27;dark&#x27; : &#x27;light&#x27;;
        themeButton.setAttribute(&#x27;aria-pressed&#x27;, String(darkTheme));
        themeButton.setAttribute(&#x27;aria-label&#x27;, darkTheme ? &#x27;Включить светлую тему&#x27; : &#x27;Включить тёмную тему&#x27;);
      };

      applyTheme();

      const people = [
        { name: &#x27;Влад&#x27;, initials: &#x27;В&#x27;, color: &#x27;light-dark(#a6aca4, #737a74)&#x27;, self: true },
        { name: &#x27;Кира&#x27;, initials: &#x27;К&#x27;, color: &#x27;#ff8069&#x27;, speaking: true },
        { name: &#x27;Макс&#x27;, initials: &#x27;М&#x27;, color: &#x27;#86bbff&#x27; },
        { name: &#x27;Аня&#x27;, initials: &#x27;А&#x27;, color: &#x27;#d9a3ff&#x27;, muted: true },
        { name: &#x27;Миша&#x27;, initials: &#x27;М&#x27;, color: &#x27;#74d6a2&#x27; },
        { name: &#x27;Юля&#x27;, initials: &#x27;Ю&#x27;, color: &#x27;#ffbb5e&#x27; },
        { name: &#x27;Даня&#x27;, initials: &#x27;Д&#x27;, color: &#x27;#62d4e8&#x27;, muted: true },
        { name: &#x27;Оля&#x27;, initials: &#x27;О&#x27;, color: &#x27;#ff9fbd&#x27; }
      ];
      const icons = () =&gt; {
        if (window.lucide &amp;&amp; typeof window.lucide.createIcons === &#x27;function&#x27;) window.lucide.createIcons();
      };

      const createWave = (wave, count = 28) =&gt; {
        wave.innerHTML = Array.from({ length: count }, () =&gt; &#x27;&lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&#x27;).join(&#x27;&#x27;);
        return [...wave.children];
      };

      const micWaveBars = createWave(micWave);
      const speakerWaveBars = createWave(speakerWave);

      const resetWave = (bars) =&gt; {
        bars.forEach((bar, index) =&gt; { bar.style.height = `${5 + (index % 3) * 2}px`; });
      };

      const setTestButton = (button, active) =&gt; {
        button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        button.innerHTML = `&lt;i data-lucide=&quot;${active ? &#x27;square&#x27; : &#x27;play&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;${active ? &#x27;Остановить&#x27; : &#x27;Проверить&#x27;}`;
        icons();
      };

      resetWave(micWaveBars);
      resetWave(speakerWaveBars);

      const notify = (text) =&gt; {
        clearTimeout(toastTimer);
        toastText.textContent = text;
        toast.setAttribute(&#x27;data-visible&#x27;, &#x27;true&#x27;);
        toastTimer = setTimeout(() =&gt; toast.setAttribute(&#x27;data-visible&#x27;, &#x27;false&#x27;), 1900);
      };

      const stopMicTest = ({ hide = true } = {}) =&gt; {
        micTestRun += 1;
        if (micTestFrame) cancelAnimationFrame(micTestFrame);
        if (micTestStream) micTestStream.getTracks().forEach((track) =&gt; track.stop());
        if (micTestContext) micTestContext.close().catch(() =&gt; {});
        micTestFrame = null;
        micTestStream = null;
        micTestContext = null;
        setTestButton(micTestButton, false);
        micTestPanel.setAttribute(&#x27;data-visible&#x27;, String(!hide));
        micTestPanel.setAttribute(&#x27;data-state&#x27;, &#x27;idle&#x27;);
        micTestMessage.textContent = &#x27;Говорите в микрофон&#x27;;
        micTestStatus.textContent = &#x27;Слушаем&#x27;;
        resetWave(micWaveBars);
      };

      const stopSpeakerTest = ({ hide = true } = {}) =&gt; {
        speakerTestRun += 1;
        clearInterval(speakerToneTimer);
        clearTimeout(speakerStopTimer);
        if (speakerTestFrame) cancelAnimationFrame(speakerTestFrame);
        if (speakerTestGain &amp;&amp; speakerTestContext) {
          const now = speakerTestContext.currentTime;
          speakerTestGain.gain.cancelScheduledValues(now);
          speakerTestGain.gain.setTargetAtTime(0, now, 0.01);
        }
        if (speakerTestOscillator &amp;&amp; speakerTestContext) {
          try { speakerTestOscillator.stop(speakerTestContext.currentTime + 0.05); } catch (error) {}
        }
        if (speakerTestContext) {
          const context = speakerTestContext;
          setTimeout(() =&gt; context.close().catch(() =&gt; {}), 70);
        }
        speakerTestFrame = null;
        speakerTestContext = null;
        speakerTestOscillator = null;
        speakerTestGain = null;
        speakerToneTimer = null;
        speakerStopTimer = null;
        setTestButton(speakerTestButton, false);
        speakerTestPanel.setAttribute(&#x27;data-visible&#x27;, String(!hide));
        speakerTestPanel.setAttribute(&#x27;data-state&#x27;, &#x27;idle&#x27;);
        speakerTestMessage.textContent = &#x27;Воспроизводим тестовый звук&#x27;;
        speakerTestStatus.textContent = &#x27;Играет&#x27;;
        resetWave(speakerWaveBars);
      };

      const startMicTest = async () =&gt; {
        stopSpeakerTest();
        stopMicTest();
        deviceSelects.forEach((select) =&gt; { select.open = false; });
        const run = micTestRun;
        micTestPanel.setAttribute(&#x27;data-visible&#x27;, &#x27;true&#x27;);
        micTestPanel.setAttribute(&#x27;data-state&#x27;, &#x27;active&#x27;);
        micTestMessage.textContent = &#x27;Говорите в микрофон&#x27;;
        micTestStatus.textContent = &#x27;Слушаем&#x27;;
        setTestButton(micTestButton, true);

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error(&#x27;media devices unavailable&#x27;);
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error(&#x27;web audio unavailable&#x27;);
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          if (run !== micTestRun) {
            stream.getTracks().forEach((track) =&gt; track.stop());
            return;
          }

          micTestStream = stream;
          micTestContext = new AudioContextClass();
          await micTestContext.resume();
          const source = micTestContext.createMediaStreamSource(stream);
          const analyser = micTestContext.createAnalyser();
          analyser.fftSize = 64;
          analyser.smoothingTimeConstant = 0.72;
          source.connect(analyser);
          const levels = new Uint8Array(analyser.frequencyBinCount);

          const drawMicWave = () =&gt; {
            analyser.getByteFrequencyData(levels);
            const middle = (micWaveBars.length - 1) / 2;
            micWaveBars.forEach((bar, index) =&gt; {
              const distance = Math.abs(index - middle) / middle;
              const levelIndex = Math.min(levels.length - 1, Math.floor(distance * 18));
              const level = Math.pow(levels[levelIndex] / 255, 0.72);
              bar.style.height = `${Math.round(5 + level * 39)}px`;
            });
            micTestFrame = requestAnimationFrame(drawMicWave);
          };

          drawMicWave();
        } catch (error) {
          if (run !== micTestRun) return;
          stopMicTest({ hide: false });
          micTestPanel.setAttribute(&#x27;data-state&#x27;, &#x27;error&#x27;);
          micTestMessage.textContent = &#x27;Не удалось получить доступ&#x27;;
          micTestStatus.textContent = &#x27;Нет доступа&#x27;;

      const startSpeakerTest = async () =&gt; {
        stopMicTest();
        stopSpeakerTest();
        deviceSelects.forEach((select) =&gt; { select.open = false; });
        const run = speakerTestRun;
        speakerTestPanel.setAttribute(&#x27;data-visible&#x27;, &#x27;true&#x27;);
        speakerTestPanel.setAttribute(&#x27;data-state&#x27;, &#x27;active&#x27;);
        speakerTestMessage.textContent = &#x27;Воспроизводим тестовый звук&#x27;;
        speakerTestStatus.textContent = &#x27;Играет&#x27;;
        setTestButton(speakerTestButton, true);

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error(&#x27;web audio unavailable&#x27;);
          speakerTestContext = new AudioContextClass();
          await speakerTestContext.resume();
          if (run !== speakerTestRun) return;

          speakerTestOscillator = speakerTestContext.createOscillator();
          speakerTestGain = speakerTestContext.createGain();
          speakerTestOscillator.type = &#x27;sine&#x27;;
          speakerTestOscillator.frequency.value = 440;
          speakerTestGain.gain.value = 0.035;
          speakerTestOscillator.connect(speakerTestGain).connect(speakerTestContext.destination);
          speakerTestOscillator.start();

          const notes = [440, 554.37, 659.25, 554.37];
          let note = 0;
          speakerToneTimer = setInterval(() =&gt; {
            note = (note + 1) % notes.length;
            if (speakerTestOscillator &amp;&amp; speakerTestContext) {
              speakerTestOscillator.frequency.setTargetAtTime(notes[note], speakerTestContext.currentTime, 0.035);
            }
          }, 360);

          const startedAt = performance.now();
          const drawSpeakerWave = (time) =&gt; {
            const elapsed = time - startedAt;
            speakerWaveBars.forEach((bar, index) =&gt; {
              const wave = (Math.sin(elapsed / 105 + index * 0.68) + 1) / 2;
              const pulse = 0.72 + Math.sin(elapsed / 185) * 0.18;
              bar.style.height = `${Math.round(7 + wave * pulse * 37)}px`;
            });
            speakerTestFrame = requestAnimationFrame(drawSpeakerWave);
          };

          if (reduceMotion) {
            speakerWaveBars.forEach((bar, index) =&gt; { bar.style.height = `${10 + (index % 5) * 6}px`; });
          } else {
            speakerTestFrame = requestAnimationFrame(drawSpeakerWave);
          }
          speakerStopTimer = setTimeout(() =&gt; {
            if (run === speakerTestRun) stopSpeakerTest();
          }, 4200);
        } catch (error) {
          if (run !== speakerTestRun) return;
          stopSpeakerTest({ hide: false });
          speakerTestPanel.setAttribute(&#x27;data-state&#x27;, &#x27;error&#x27;);
          speakerTestMessage.textContent = &#x27;Не удалось воспроизвести звук&#x27;;

          &lt;h2&gt;Вход в комнату&lt;/h2&gt;&lt;p&gt;Сначала настроим звук.&lt;/p&gt;
          &lt;div class=&quot;r96d-notice&quot;&gt;&lt;span class=&quot;r96d-notice-icon&quot;&gt;&lt;i data-lucide=&quot;${state.icon}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;div&gt;&lt;strong&gt;${state.title}&lt;/strong&gt;&lt;p&gt;${state.text}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

        else if (next === &#x27;invalid-name-long&#x27;) main.innerHTML = prejoinMarkup(&#x27;too-long&#x27;);
        else if ([&#x27;permission&#x27;,&#x27;blocked&#x27;,&#x27;no-device&#x27;].includes(next)) main.innerHTML = accessMarkup(next);
        else if (next === &#x27;connecting&#x27;) main.innerHTML = connectingMarkup();
        else if (isCall) main.innerHTML = callMarkup(callCounts[next]);
        else main.innerHTML = systemMarkup(next);
        icons();

      };

      const startConnection = () =&gt; {
        render(&#x27;connecting&#x27;);
        connectionTimer = setTimeout(() =&gt; render(&#x27;solo&#x27;), 2700);
      };

      const startCreate = () =&gt; {
        render(&#x27;create-loading&#x27;);
        connectionTimer = setTimeout(() =&gt; render(&#x27;prejoin&#x27;), 1200);
      };

      main.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const target = event.target.closest(&#x27;[data-action]&#x27;);

        if (action === &#x27;toggle-prejoin-mic&#x27; || action === &#x27;toggle-call-mic&#x27;) { micOn = !micOn; render(current); }
        if (action === &#x27;copy&#x27;) notify(&#x27;Ссылка скопирована&#x27;);
        if (action === &#x27;join&#x27;) {
          const name = main.querySelector(&#x27;#r96d-name&#x27;);
          const trimmedName = name ? name.value.trim() : &#x27;&#x27;;
          if (!trimmedName) render(&#x27;invalid-name&#x27;);

          else startConnection();
        }
        if (action === &#x27;system-primary&#x27;) {
          if ([&#x27;expired&#x27;, &#x27;not-found&#x27;, &#x27;finished&#x27;].includes(current)) render(&#x27;home&#x27;);
          else startConnection();
        }
        if (action === &#x27;grant&#x27;) { micOn = true; render(&#x27;prejoin&#x27;); notify(&#x27;Доступ к микрофону получен&#x27;); }
        if (action === &#x27;join-muted&#x27;) { micOn = false; startConnection(); }
        if (action === &#x27;settings&#x27;) openSettings(target);
        if (action === &#x27;leave&#x27;) render(&#x27;left&#x27;);
        if (action === &#x27;system-secondary&#x27;) render(current === &#x27;clipboard&#x27; ? &#x27;prejoin&#x27; : &#x27;home&#x27;);
      });

      scenario.addEventListener(&#x27;change&#x27;, () =&gt; render(scenario.value));
      settings.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const target = event.target.closest(&#x27;[data-action]&#x27;);
        if (!target) return;
        if (target.dataset.action === &#x27;close-settings&#x27;) closeSettings();
        if (target.dataset.action === &#x27;test-settings-mic&#x27;) {
          if (target.getAttribute(&#x27;aria-pressed&#x27;) === &#x27;true&#x27;) stopMicTest();

        if (target.dataset.action === &#x27;test-speakers&#x27;) {

          else startSpeakerTest();

        if (target.dataset.action === &#x27;choose-device&#x27;) {
          const kind = target.dataset.deviceKind;
          const value = target.dataset.deviceValue;
          const select = target.closest(&#x27;[data-r96d-device-select]&#x27;);
          if (kind === &#x27;mic&#x27;) stopMicTest();
          if (kind === &#x27;speaker&#x27;) stopSpeakerTest();
          selectedDevices[kind] = value;
          select.querySelector(&#x27;[data-r96d-device-value]&#x27;).textContent = value;
          select.querySelectorAll(&#x27;[data-r96d-device-option]&#x27;).forEach((option) =&gt; {
            option.setAttribute(&#x27;aria-pressed&#x27;, String(option === target));
          });
          select.open = false;
          select.querySelector(&#x27;summary&#x27;).focus();
          if (kind === &#x27;mic&#x27;) {
            const currentMic = main.querySelector(&#x27;[data-r96d-current-mic]&#x27;);
            if (currentMic) currentMic.textContent = value;
          }
        }
      });

      deviceSelects.forEach((select) =&gt; select.addEventListener(&#x27;toggle&#x27;, () =&gt; {
        if (!select.open) return;
        deviceSelects.forEach((other) =&gt; { if (other !== select) other.open = false; });
      }));

      root.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
        if (settings.getAttribute(&#x27;data-visible&#x27;) !== &#x27;true&#x27;) return;
        if (event.key === &#x27;Escape&#x27;) {
          const openSelect = settings.querySelector(&#x27;[data-r96d-device-select][open]&#x27;);
          if (openSelect) {
            openSelect.open = false;
            openSelect.querySelector(&#x27;summary&#x27;).focus();
          } else {
            closeSettings();
          }
          return;
        }
        if (event.key !== &#x27;Tab&#x27;) return;
        const focusable = [...settings.querySelectorAll(&#x27;summary, button:not([disabled])&#x27;)]
          .filter((item) =&gt; item.getClientRects().length &gt; 0);
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey &amp;&amp; document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey &amp;&amp; document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
      deviceButtons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        deviceButtons.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
        product.classList.toggle(&#x27;r96d-compact&#x27;, button.dataset.r96dDevice === &#x27;compact&#x27;);
      }));
      themeButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        darkTheme = !darkTheme;
        applyTheme();
      });

      render(&#x27;home&#x27;);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;

(() =&gt; {

    return;

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

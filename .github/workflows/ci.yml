name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run CI checks
        run: make ci

  web:
    name: Web lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify generated API types
        run: npm run generate:check

      - name: Run frontend checks
        run: npm run check

  production-images:
    name: Production images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check production scripts
        run: make production-scripts-check

      - name: Build production images
        run: make PRODUCTION_ENV_FILE=.env.production.example production-build

  publish-production-images:
    name: Publish production images
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - checks
      - web
      - production-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PRODUCTION_ENV_FILE: .env.production.publish
      YC_CI_SERVICE_ACCOUNT_ID: ${{ vars.YC_CI_SERVICE_ACCOUNT_ID }}
      YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate publication configuration
        run: |
          : "${YC_CI_SERVICE_ACCOUNT_ID:?YC_CI_SERVICE_ACCOUNT_ID repository variable is required}"
          : "${YC_REGISTRY_ID:?YC_REGISTRY_ID repository variable is required}"

      - name: Log in to Yandex Container Registry
        uses: yc-actions/yc-cr-login@ee42362bcacb854964afa3a3180ca8ae6dd388f8 # v3
        with:
          yc-sa-id: ${{ vars.YC_CI_SERVICE_ACCOUNT_ID }}

      - name: Prepare production image metadata
        run: |
          cp .env.production.example "$PRODUCTION_ENV_FILE"
          sed -i \
            -e "s|^PRODUCTION_IMAGE_PREFIX=.*|PRODUCTION_IMAGE_PREFIX=cr.yandex/$YC_REGISTRY_ID|" \
            -e "s|^PRODUCTION_RELEASE_TAG=.*|PRODUCTION_RELEASE_TAG=$GITHUB_SHA|" \
            "$PRODUCTION_ENV_FILE"

      - name: Build production images
        run: make production-build

      - name: Push production images
        run: make production-push

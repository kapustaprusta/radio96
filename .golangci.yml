version: "2"

linters:
  default: standard
  enable:
    # Correctness and security.
    - asciicheck
    - bidichk
    - durationcheck
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - gosec
    - makezero
    - nilerr
    - nilnesserr
    - nilnil
    - wastedassign

    # Errors.
    - errname
    - errorlint

    # Context and resource lifetime.
    - bodyclose
    - containedctx
    - contextcheck
    - fatcontext
    - noctx
    - rowserrcheck
    - sqlclosecheck

    # HTTP and logging.
    - canonicalheader
    - loggercheck
    - sloglint

    # Maintainability and tests.
    - importas
    - inamedparam
    - misspell
    - nolintlint
    - predeclared
    - recvcheck
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wsl_v5
  settings:
    wsl_v5:
      default: none
      enable:
        - after-block

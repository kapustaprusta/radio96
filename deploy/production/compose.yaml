x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    image: ${PRODUCTION_IMAGE_PREFIX:?required}/radio96-migrate:${PRODUCTION_RELEASE_TAG:?required}
    platform: ${PRODUCTION_PLATFORM:-linux/amd64}
    user: "10001:10001"
    environment:
      DATABASE_URL: ${PRODUCTION_DATABASE_URL:?PRODUCTION_DATABASE_URL is required}
    entrypoint:
      - /bin/sh
      - -ec
      - exec /migrate -path /migrations -database "$${DATABASE_URL}" up
    volumes:
      - type: bind
        source: ${PRODUCTION_DATABASE_CA_FILE:?PRODUCTION_DATABASE_CA_FILE is required}
        target: /yc-ca.pem
        read_only: true
    networks:
      - application
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: "no"

  app:
    image: ${PRODUCTION_IMAGE_PREFIX:?required}/radio96-api:${PRODUCTION_RELEASE_TAG:?required}
    platform: ${PRODUCTION_PLATFORM:-linux/amd64}
    init: true
    environment:
      HTTP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: ${PRODUCTION_SHUTDOWN_TIMEOUT:-10s}
      DATABASE_URL: ${PRODUCTION_DATABASE_URL:?PRODUCTION_DATABASE_URL is required}
      DATABASE_CONNECT_TIMEOUT: ${PRODUCTION_DATABASE_CONNECT_TIMEOUT:-5s}
      MEDIA_REQUEST_TIMEOUT: ${PRODUCTION_MEDIA_REQUEST_TIMEOUT:-5s}
      LIVEKIT_URL: ${PRODUCTION_LIVEKIT_URL:?PRODUCTION_LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${PRODUCTION_LIVEKIT_API_KEY:?PRODUCTION_LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${PRODUCTION_LIVEKIT_API_SECRET:?PRODUCTION_LIVEKIT_API_SECRET is required}
    volumes:
      - type: bind
        source: ${PRODUCTION_DATABASE_CA_FILE:?PRODUCTION_DATABASE_CA_FILE is required}
        target: /yc-ca.pem
        read_only: true
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - application
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: 15s

  gateway:
    image: ${PRODUCTION_IMAGE_PREFIX:?required}/radio96-web:${PRODUCTION_RELEASE_TAG:?required}
    platform: ${PRODUCTION_PLATFORM:-linux/amd64}
    init: true
    environment:
      SITE_ADDRESS: ${PRODUCTION_SITE_ADDRESS:?PRODUCTION_SITE_ADDRESS is required}
      ACME_EMAIL: ${PRODUCTION_ACME_EMAIL:?PRODUCTION_ACME_EMAIL is required}
      PRODUCTION_RELEASE_TAG: ${PRODUCTION_RELEASE_TAG:?PRODUCTION_RELEASE_TAG is required}
    ports:
      - "${PRODUCTION_HTTP_PORT:-80}:80"
      - "${PRODUCTION_HTTPS_PORT:-443}:443"
      - "${PRODUCTION_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - application
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: 15s

networks:
  application:

volumes:
  caddy-config:
  caddy-data:

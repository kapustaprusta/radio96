services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radio96}
      POSTGRES_USER: ${POSTGRES_USER:-radio96}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radio96}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-radio96}
    command:
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER:-radio96}@postgres:5432/${POSTGRES_DB:-radio96}?sslmode=disable
      - up
    volumes:
      - type: bind
        source: ./db/migrations
        target: /migrations
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: radio96:local
    build:
      context: .
      dockerfile: deploy/Dockerfile
    init: true
    environment:
      HTTP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      DATABASE_URL: postgres://${POSTGRES_USER:-radio96}@postgres:5432/${POSTGRES_DB:-radio96}?sslmode=disable
      PGPASSWORD: ${POSTGRES_PASSWORD:-radio96}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5s}
      MEDIA_REQUEST_TIMEOUT: ${MEDIA_REQUEST_TIMEOUT:-5s}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  postgres-data:

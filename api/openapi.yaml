openapi: 3.1.2

info:
  title: radio96 API
  version: 0.1.0
  description: |
    HTTP API for creating one-time voice rooms and joining them through
    LiveKit. Invite codes and participant tokens are secrets and must not be
    logged or cached.

servers:
  - url: /
    description: Same origin as the web application

tags:
  - name: Rooms
    description: One-time voice rooms
  - name: LiveKit
    description: LiveKit server callbacks

paths:
  /api/v1/rooms:
    post:
      tags:
        - Rooms
      summary: Create a room
      description: |
        Creates an open room and returns its opaque application ID together
        with the invite URL. The LiveKit room is created later, when the first
        participant connects.
      operationId: createRoom
      responses:
        "201":
          description: Room created
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Referrer-Policy:
              $ref: "#/components/headers/ReferrerPolicy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRoomResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/rooms/{inviteCode}:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    get:
      tags:
        - Rooms
      summary: Get public room status
      description: |
        Returns the application-level room status. Participant information and
        the internal LiveKit room name are never exposed.
      operationId: getRoom
      responses:
        "200":
          description: Room status
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Referrer-Policy:
              $ref: "#/components/headers/ReferrerPolicy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/rooms/{inviteCode}/join:
    parameters:
      - $ref: "#/components/parameters/InviteCode"
    post:
      tags:
        - Rooms
      summary: Join a room
      description: |
        Validates the room and display name, then issues short-lived LiveKit
        connection credentials. Duplicate display names are allowed. Local
        microphone availability and browser permission are not prerequisites:
        the participant may connect without publishing an audio track and
        start publishing a microphone later with the same credentials.
      operationId: joinRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomRequest"
      responses:
        "200":
          description: LiveKit connection credentials
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            Referrer-Policy:
              $ref: "#/components/headers/ReferrerPolicy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRoomResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"

  /api/v1/livekit/webhook:
    post:
      tags:
        - LiveKit
      summary: Receive a LiveKit webhook
      description: |
        Receives and verifies LiveKit webhook events. Unsupported authenticated
        event types are acknowledged and ignored. Duplicate event IDs are
        handled idempotently.
      operationId: receiveLiveKitWebhook
      security:
        - LiveKitWebhookSignature: []
      requestBody:
        required: true
        content:
          application/webhook+json:
            schema:
              $ref: "#/components/schemas/LiveKitWebhookEvent"
      responses:
        "204":
          description: Event accepted, already processed, or intentionally ignored
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    LiveKitWebhookSignature:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Signed JWT generated by LiveKit. Its payload hash must be verified
        against the unmodified request body.

  parameters:
    InviteCode:
      name: inviteCode
      in: path
      required: true
      description: |
        A case-sensitive, cryptographically random 32-character code using
        ASCII letters and digits (A-Z, a-z, 0-9). The backend stores only its
        SHA-256 hash. Legacy 43-character codes are not supported.
      schema:
        type: string
        minLength: 32
        maxLength: 32
        pattern: "^[A-Za-z0-9]{32}$"

  headers:
    CacheControl:
      description: Prevents storage of room links and participant credentials.
      schema:
        type: string
        const: no-store
    ReferrerPolicy:
      description: Prevents an invite code from leaking through the Referer header.
      schema:
        type: string
        const: no-referrer

  responses:
    ErrorResponse:
      description: Request failed
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Referrer-Policy:
          $ref: "#/components/headers/ReferrerPolicy"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    CreateRoomResponse:
      type: object
      additionalProperties: false
      required:
        - roomId
        - inviteUrl
        - expiresAt
        - maxParticipants
      properties:
        roomId:
          type: string
          minLength: 1
          description: |
            Opaque application-level room ID. It is not an invite code, is not
            shown as the room title, and must not be used to construct the
            share URL.
        inviteUrl:
          type: string
          format: uri-reference
          description: |
            Same-origin `/rooms/{inviteCode}` URL. The frontend resolves it to
            an absolute URL before sharing and may copy the current browser URL
            after navigation. The backend stores only the invite-code hash and
            does not provide a separate endpoint for reconstructing this URL.
          examples:
            - /rooms/w7pM8xK2qR5vT9nY4dF6gH1jL3sC0bN2
        expiresAt:
          type: string
          format: date-time
          description: Time by which the first participant must join.
        maxParticipants:
          type: integer
          const: 8

    RoomResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - expiresAt
      properties:
        status:
          $ref: "#/components/schemas/RoomStatus"
        expiresAt:
          type: string
          format: date-time
          description: Original deadline for the first participant to join.

    RoomStatus:
      type: string
      enum:
        - open
        - active
        - finished
        - expired

    JoinRoomRequest:
      type: object
      additionalProperties: false
      description: |
        The backend does not receive microphone availability or permission
        state. The same request is used for participants joining with or without
        a local microphone track.
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 32
          description: |
            Participant-visible name. Whitespace is trimmed before validation;
            the resulting value must contain from 1 to 32 Unicode characters.

    JoinRoomResponse:
      type: object
      additionalProperties: false
      required:
        - serverUrl
        - participantToken
        - participantIdentity
      properties:
        serverUrl:
          type: string
          format: uri
          description: LiveKit WebSocket URL.
          examples:
            - wss://radio96.example.livekit.cloud
        participantToken:
          type: string
          minLength: 1
          description: |
            Short-lived LiveKit participant JWT. It permits microphone-only
            publication but does not require the participant to publish a track.
        participantIdentity:
          type: string
          minLength: 1
          description: Opaque identity unique within the LiveKit room.

    LiveKitWebhookEvent:
      type: object
      additionalProperties: true
      required:
        - id
        - createdAt
        - event
      properties:
        id:
          type: string
          format: uuid
          description: Stable event identifier used for idempotency.
        createdAt:
          type: integer
          format: int64
          minimum: 0
          description: Unix timestamp in seconds.
        event:
          type: string
          minLength: 1
          examples:
            - room_started
        room:
          $ref: "#/components/schemas/LiveKitRoom"

    LiveKitRoom:
      type: object
      additionalProperties: true
      properties:
        sid:
          type: string
        name:
          type: string

    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          description: Stable machine-readable error code.
          examples:
            - invalid_name
            - room_not_found
            - room_expired
            - room_finished
            - room_full
            - media_unavailable
            - invalid_webhook
            - internal_error
        message:
          type: string
          minLength: 1
          description: Human-readable message; clients must branch on code.
